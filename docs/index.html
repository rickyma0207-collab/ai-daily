<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 日报</title>
  <meta name="description" content="每天自动汇集最新 AI 新闻、博客、论文和视频">
  <meta name="theme-color" content="#07080F">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 日报">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>

  <!-- 首页 -->
  <section class="view" id="view-home">
    <header class="head">
      <div class="titles">
        <h1 class="grad-title">AI 日报</h1>
        <p class="sub" id="home-sub"></p>
      </div>
      <button class="icon-btn" id="refresh" aria-label="刷新">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <button class="search-fake" id="go-search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>搜索 AI 新闻、论文、视频…</span>
    </button>
    <div class="hero" id="hero"></div>
    <div class="dots" id="dots"></div>
    <nav class="chips" id="home-cats" aria-label="分类"></nav>
    <div class="sec-label">
      <span id="home-label">今天</span>
      <select id="range" aria-label="时间范围">
        <option value="1">24小时</option><option value="3">3天</option><option value="7">7天</option>
        <option value="30">30天</option><option value="0">全部时间</option>
      </select>
    </div>
    <div class="list" id="home-list"></div>
    <button class="more" id="home-more" hidden>加载更多</button>
    <p class="foot" id="foot"></p>
  </section>

  <!-- 视频 -->
  <section class="view" id="view-video" hidden>
    <header class="head">
      <div class="titles">
        <h1 class="grad-title pink">视频</h1>
        <p class="sub" id="video-sub"></p>
      </div>
    </header>
    <nav class="chips" id="video-chans" aria-label="频道"></nav>
    <div class="list" id="video-list"></div>
    <button class="more" id="video-more" hidden>加载更多</button>
  </section>

  <!-- 搜索 -->
  <section class="view" id="view-search" hidden>
    <div class="search-row">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜索标题、摘要、来源" autocomplete="off" enterkeyhint="search">
        <button id="q-clear" aria-label="清空" hidden>✕</button>
      </label>
      <button class="link" id="q-cancel">取消</button>
    </div>
    <div class="hot" id="hot"><span>热搜</span></div>
    <nav class="chips" id="search-cats" aria-label="分类"></nav>
    <p class="sec-label" id="search-count"></p>
    <div class="list" id="search-list"></div>
    <button class="more" id="search-more" hidden>加载更多</button>
  </section>

  <!-- 收藏 -->
  <section class="view" id="view-fav" hidden>
    <header class="head">
      <div class="titles">
        <h1 class="grad-title gold">我的收藏</h1>
        <p class="sub" id="fav-sub"></p>
      </div>
    </header>
    <nav class="chips" id="fav-cats" aria-label="分类"></nav>
    <div class="list" id="fav-list"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>首页</a>
    <a href="#video" data-tab="video"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>视频</a>
    <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>搜索</a>
    <a href="#fav" data-tab="fav"><svg viewBox="0 0 24 24" fill="none"><path class="star-path" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>收藏</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
